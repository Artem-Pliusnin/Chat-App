<div class="find-cont">
  <input
    type="text"
    id="Username"
    name="Username"
    maxlength="30"
    [(ngModel)]="username"
    placeholder="Username"
  />
  <button type="button" (click)="onFind()">
    <img src="./find.png" alt="" />
  </button>
</div>
<div class="users-list">
  @for (user of users; track user.id) {
  <app-user-card
    [user]="user"
    (onAddUser)="onSelectUser($event)"
  ></app-user-card>
  }
</div>
