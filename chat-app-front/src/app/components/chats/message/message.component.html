<div class="container">
  @if(!isMine){
  <img [src]="message.user.image" [alt]="" />
  <div class="message-cont">
    <span class="sender-name">{{ message.user.username }}</span>
    <div class="text-cont">
      <span class="message">{{ message.text }}</span>
      <span class="time">{{ message.time | timePipe }}</span>
    </div>
  </div>
  } @else {
  <div class="message-cont my-message-cont">
    <span class="sender-name">{{ message.user.username }}</span>
    <div class="text-cont">
      <span class="message">{{ message.text }}</span>
      <span class="time">{{ message.time | timePipe }}</span>
    </div>
  </div>
  <img [src]="message.user.image" [alt]="" />
  }
</div>
