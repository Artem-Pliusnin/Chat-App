<button class="card" [class.active]="selected" (click)="onCardClick()">
  <img [src]="chat.image" [alt]="" />
  <div class="text-info-cont">
    <span class="name">{{ chat.name }}</span>
    <span class="message"> {{ chat.lastmessage | truncate }}</span>
  </div>
  @if(chat.hasUnreadMessages){
  <div class="orange-point"></div>
  }
</button>
